name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Which browser suites a pull request needs (pushes to main run both). A change outside the paths of one app
  # (agent, server, docs...) skips that app's suite; shared files (lockfile, configs, CI, packages the app
  # uses) run it.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      calendar: ${{ steps.diff.outputs.calendar }}
      boni: ${{ steps.diff.outputs.boni }}
      desktop: ${{ steps.diff.outputs.desktop }}
      calendar_desktop: ${{ steps.diff.outputs.calendar_desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "calendar=true" >> "$GITHUB_OUTPUT"; echo "boni=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"; echo "calendar_desktop=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          printf '%s\n' "$files"
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig[^/]*\.json|biome\.json|\.github/)'
          has() { printf '%s\n' "$files" | grep -Eq "$1|$shared" && echo true || echo false; }
          # Two of the calendar's specs start Boni's real server (e2e/server.spec.ts, e2e/server-boni.spec.ts): the
          # server and the packages it loads count too (2026-11-12: #387 changed the inbox's accept, skipped this
          # suite, and left main red; T-07).
          echo "calendar=$(has '^(apps/calendar-web/|apps/calendar-desktop/|apps/server/|packages/|e2e/|playwright\.config\.ts)')" >> "$GITHUB_OUTPUT"
          # The Boni e2e suite fakes the server in the page, and its fixtures import server code (boni-records.ts:
          # systemCollections over the store's audit, the views' engine): a change there runs it too (2026-11-04:
          # audit.activitySince, added for the server alone, broke every Boni e2e test unseen for a day).
          echo "boni=$(has '^(apps/boni-web/|e2e-boni/|playwright\.boni\.config\.ts|apps/server/src/systemCollections\.ts|packages/store/src/audit\.ts|packages/views/)')" >> "$GITHUB_OUTPUT"
          echo "desktop=$(has '^(apps/boni-web/|apps/boni-desktop/|apps/server/|packages/|e2e-boni-desktop/|playwright\.boni-desktop\.config\.ts)')" >> "$GITHUB_OUTPUT"
          # The calendar's peek is Boni's page from Boni's server: the calendar, the server and Boni's web all count.
          echo "calendar_desktop=$(has '^(apps/calendar-web/|apps/calendar-desktop/|apps/boni-web/|apps/server/|packages/|e2e-calendar-desktop/|e2e/server-data\.ts|playwright\.calendar-desktop\.config\.ts)')" >> "$GITHUB_OUTPUT"
          # I-05 (docs/principios.md): every change to a web app ships in a desktop version newer than the last
          # release's (CHANGELOG.md's newest entry); a batch bumps it once. (Tests are not shipped: a test alone
          # needs no new version.)
          newer() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$2" ] && [ "$1" != "$2" ]; }
          check_version() { # <web dir> <desktop package.json> <name in CHANGELOG.md>
            if printf '%s\n' "$files" | grep "^$1/src/" | grep -vqE '\.test\.tsx?$'; then
              released=$(grep -oEm1 "$3 [0-9]+\.[0-9]+\.[0-9]+" CHANGELOG.md | grep -oE '[0-9.]+$')
              current=$(node -p "require('./$2').version")
              if ! newer "$released" "$current"; then
                echo "::error::$1 changed: bump $2's version above the last release's ($released; docs/principios.md, I-05)"
                exit 1
              fi
            fi
          }
          check_version apps/boni-web apps/boni-desktop/package.json "Boni desktop"
          check_version apps/calendar-web apps/calendar-desktop/package.json "Boni Calendar desktop"

  # The calendar's suite in two halves on two machines; Boni's on a third. All start without waiting for `check`.
  e2e-calendar:
    needs: changes
    if: needs.changes.outputs.calendar == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner's own Google Chrome (playwright configs: channel "chrome"); nothing to install.
      - run: google-chrome --version
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-calendar-${{ matrix.shard }}
          path: e2e/screenshots

  e2e-boni:
    needs: changes
    if: needs.changes.outputs.boni == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner's own Google Chrome (playwright configs: channel "chrome"); nothing to install.
      - run: google-chrome --version
      - run: pnpm exec playwright test -c playwright.boni.config.ts
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-boni
          path: |
            e2e-boni/screenshots
            e2e-boni/__screens__
            test-results

  # I-06 (docs/principios.md): Boni's desktop app driven for real, as on Juan's computer, on a virtual screen: the
  # real server with an invented account and vault, a temporary profile.
  e2e-boni-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 keeps unprivileged namespaces from AppArmor-less programs; Electron's sandbox needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a --server-args="-screen 0 1920x1080x24" make e2e-boni-desktop
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-boni-desktop
          path: |
            e2e-boni/screenshots
            test-results

  # I-06 too: Boni Calendar's desktop app driven for real, with its note peek (Boni's page from Boni's server),
  # on a virtual screen (task 25, 2026-11-03: its suite had been failing outside CI for ten days without anyone seeing).
  e2e-calendar-desktop:
    needs: changes
    if: needs.changes.outputs.calendar_desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a --server-args="-screen 0 1920x1080x24" make e2e-calendar-desktop
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-calendar-desktop
          path: |
            e2e/screenshots
            test-results

  # The check `main` requires: the suites that ran passed (a skipped one is not needed by the change).
  e2e:
    needs: [changes, e2e-calendar, e2e-boni, e2e-boni-desktop, e2e-calendar-desktop]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} calendar=${{ needs.e2e-calendar.result }} boni=${{ needs.e2e-boni.result }} desktop=${{ needs.e2e-boni-desktop.result }} calendar-desktop=${{ needs.e2e-calendar-desktop.result }}"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          for r in "${{ needs.e2e-calendar.result }}" "${{ needs.e2e-boni.result }}" "${{ needs.e2e-boni-desktop.result }}" "${{ needs.e2e-calendar-desktop.result }}"; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done

  package:
    runs-on: ubuntu-24.04
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter boni-calendar-desktop dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.deb
            release/*.AppImage
