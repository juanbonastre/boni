name: android

# The Android app: the web UI built into the APK's assets, in a WebView shell (apps/calendar-android).
on:
  pull_request:
    paths: ["apps/calendar-android/**", "apps/calendar-web/**", "packages/calendar/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["apps/calendar-android/**", "apps/calendar-web/**", "packages/calendar/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# Signed releases (for Obtainium) need four repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD. Without them the APK is debug-signed and only kept as an artifact.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web UI into the APK's assets
        run: |
          pnpm build
          rm -rf apps/calendar-android/app/src/main/assets/web
          mkdir -p apps/calendar-android/app/src/main/assets
          cp -r apps/calendar-web/dist apps/calendar-android/app/src/main/assets/web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: debug-signed APK as an artifact only, no release."
          fi
      - name: Unit tests
        working-directory: apps/calendar-android
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace
      - name: Build APK
        working-directory: apps/calendar-android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Name APK
        run: cp apps/calendar-android/app/build/outputs/apk/release/app-release.apk "boni-calendar-0.1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: boni-calendar-apk
          path: boni-calendar-*.apk
      # A signed build of main becomes a GitHub release that Obtainium installs (filter: titles starting with "Boni Calendar Android"; tags calendar-android-v…).
      - name: Release
        if: env.SIGNED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calendar-android-v0.1.${{ github.run_number }}
          name: Boni Calendar Android 0.1.${{ github.run_number }}
          files: boni-calendar-*.apk
