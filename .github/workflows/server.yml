name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "api/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "api/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv venv -p 3.12 && uv pip install -e '.[dev]'
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Tests (incl. api/schema and api/examples drift)
        run: .venv/bin/pytest -v
      - name: Docker image builds
        run: docker build -t boni-server:ci .
