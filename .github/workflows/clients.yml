name: clients

on:
  push:
    branches: [main]
    paths: ["clients/**", "api/**", ".github/workflows/clients.yml"]
  pull_request:
    paths: ["clients/**", "api/**", ".github/workflows/clients.yml"]
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (incl. parsing api/examples)
        run: ./gradlew test --no-daemon --stacktrace
      - name: Screenshots (charts and widgets, light and dark)
        run: ./gradlew :desktop:screenshots --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: clients/desktop/build/screenshots/*.png
      - name: Package .deb
        run: ./gradlew :desktop:packageDeb --no-daemon --stacktrace -PboniVersion=0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: boni-deb
          path: clients/desktop/build/compose/binaries/main/deb/*.deb
