[project]
name = "boni-server"
version = "0.2.0"
description = "Boni server: client API, MCP client towards data sources, statistics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.31",
    "pydantic>=2.12",
    "mcp==2.3.0",          # same SDK version as vault-mcp 0.4.0 (protocol 2026-07-28)
    "tzdata>=2024.1",      # zoneinfo data in slim images
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
boni = "boni.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["boni*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
